<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Uma página simples de demonstração da branch 1.">
  <title>Branch 1 | Página de teste</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f1f5f9; color: #172033; }
    main { width: min(100%, 38rem); padding: clamp(2rem, 6vw, 4rem); border: 1px solid #dbe3ee; border-radius: 1.25rem; background: white; box-shadow: 0 1rem 3rem #17203314; }
    .tag { display: inline-block; margin: 0 0 1rem; padding: .35rem .7rem; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-size: .85rem; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 3.5rem); letter-spacing: -.04em; }
    p { color: #526078; line-height: 1.7; }
    a { display: inline-block; margin-top: .5rem; padding: .75rem 1rem; border-radius: .65rem; background: #4f46e5; color: white; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { background: #3730a3; }
    a:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Demonstração</p>
    <h1>Branch 1</h1>
    <p>Esta página apresenta uma estrutura HTML semântica, responsiva e acessível, com estilos simples integrados.</p>
    <a href="#sobre">Conheça a página</a>
    <section id="sobre" aria-label="Sobre esta página">
      <p>Exemplo criado para testar alterações na branch 1.</p>
    </section>
  </main>
</body>
</html>
