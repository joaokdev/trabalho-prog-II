<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wireframe</title>
<style>
:root{--bg:#fff;--fg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff;--fg:#000}}
:root[data-theme="dark"]{--bg:#fff;--fg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font-family:Calibri,Carlito,Arial,sans-serif;font-size:26px}
.pagina{position:relative;width:100%;max-width:1183px;height:613px;margin:0 auto;border:1px solid var(--fg);overflow-x:auto}
.pagina>*{position:absolute;display:flex;align-items:center;justify-content:center}
.caixa{border:1px solid var(--fg)}
.logo{left:57px;top:25px;width:206px;height:104px}
.info1{left:54.8%;top:73px;transform:translate(-50%,-50%)}
.info2{left:86.4%;top:73px;transform:translate(-50%,-50%)}
.menu{left:57px;right:67px;top:145px;height:44px}
.principal{left:57px;right:67px;top:198px;height:271px}
.imagem{left:74px;top:236px;width:238px;height:207px}
.texto{left:54.5%;top:340px;transform:translate(-50%,-50%)}
.rodape{left:57px;right:67px;top:483px;height:104px}
.r{font-size:21px;top:533px;transform:translate(-50%,-50%)}
.r1{left:12.4%}.r2{left:47.1%}.r3{left:85.2%}
</style>
</head>
<body>
<div class="pagina">
  <div class="caixa logo">Logo</div>
  <div class="info1">Informação 1</div>
  <div class="info2">Informação 2</div>
  <div class="caixa menu">Menu</div>
  <div class="caixa principal"></div>
  <div class="caixa imagem">Imagem</div>
  <div class="texto">Texto</div>
  <div class="caixa rodape"></div>
  <div class="r r1">Links úteis</div>
  <div class="r r2">Fale conosco</div>
  <div class="r r3">Redes sociais</div>
</div>
</body>
</html>
